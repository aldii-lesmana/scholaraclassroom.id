{% extends 'admin/base.html' %}
{% block content %}
<div class="page-header">
    <div class="page-header-left">
        <h1>Tambah Pelanggan</h1>
        <div class="breadcrumb"><a href="/pelanggan">Pelanggan</a> / Tambah</div>
    </div>
</div>

<div class="form-card" style="max-width:700px">
    <div class="form-card-header">Informasi Pelanggan</div>
    <div class="form-card-body">
        <form method="POST">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Nama Lengkap / Perusahaan *</label>
                    <input type="text" name="nama" required placeholder="Masukkan nama pelanggan">
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="contoh@email.com">
                </div>
                
                <div class="form-group">
                    <label>No. Telepon / WhatsApp</label>
                    <input type="tel" name="telepon" placeholder="08xxxxxxxxxx">
                </div>
                
                <div class="form-group">
                    <label>Kota Domisili</label>
                    <input type="text" name="kota" placeholder="Contoh: Jakarta">
                </div>
                
                <div class="form-group">
                    <label>Status Akun</label>
                    <select name="status">
                        <option value="aktif">Aktif</option>
                        <option value="tidak_aktif">Tidak Aktif</option>
                    </select>
                </div>
                
                <div class="form-group full">
                    <label>Alamat Lengkap</label>
                    <textarea name="alamat" placeholder="Jl. Contoh No. 123..."></textarea>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Simpan Data</button>
                <a href="/pelanggan" class="btn btn-outline">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
